<sly data-sly-use.model="com.adobe.aem.guides.wknd.core.models.WorkingAdityaModel">

<sly data-sly-test="${model.image}">
    <img src="${model.image}" alt="Photo">
</sly>

<sly data-sly-test="${model.fullname}">
    <h1>Name: ${model.fullname}</h1>
</sly>

<sly data-sly-test="${model.smallName}">
    <h2>Institute Name: ${model.smallName}</h2>
</sly>

<sly data-sly-test="${model.views}">
    <p>Views: ${model.views}</p>
</sly>

<sly data-sly-list.level="${model.fieldClass}">
    <p>${level.moreSmallname}</p>
</sly>

<sly data-sly-list.level="${model.fieldExp}">
    <p>${level.experience}</p>
</sly>
</sly>
